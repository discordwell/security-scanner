[project]
name = "security-scanner"
version = "0.1.0"
description = "Evidence-first executable supply-chain analysis harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "alembic>=1.15.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
]
tools = [
  "yara-python>=4.5.0,<5.0.0",
]
analysis = [
  "angr>=9.2.0",
]
postgres = [
  "asyncpg>=0.30.0,<1.0.0",
]
worker = [
  "arq>=0.26.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests requiring external tools (yara-python, capa, ghidra)",
]
